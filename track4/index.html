<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urban Heat Island Analysis</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Urban Heat Island &amp; Green Canopy Analysis</h1>
</header>

<div id="controls">
  <label for="city-select">City</label>
  <select id="city-select">
    <option value="bhubaneswar">Bhubaneswar, Odisha</option>
    <option value="delhi">Delhi</option>
    <option value="phalodi">Phalodi, Rajasthan</option>
    <option value="titlagarh">Titlagarh, Odisha</option>
  </select>
  <div id="layer-buttons">
    <button class="layer-btn active" data-layer="rgb">Satellite</button>
    <button class="layer-btn" data-layer="landcover">Land cover</button>
    <button class="layer-btn" data-layer="lst">Heat</button>
    <button class="layer-btn" data-layer="ndvi">Greenery</button>
    <button class="layer-btn" data-layer="priority">Plant here</button>
  </div>
</div>

<div id="map"></div>
<div id="info-panel">
  <p>Draw a rectangle on the map to select an area.</p>
</div>
<div id="legend"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
<script src="app.js"></script>
</body>
</html>
